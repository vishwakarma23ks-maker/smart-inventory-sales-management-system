<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SmartStock</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <img src="{{ url_for('static', filename='assets/images/logo.png') }}" alt="Logo" class="auth-logo">
      <h2>Welcome Back</h2>
      <p>Sign in to manage your inventory and sales.</p>
    </div>

    <form method="POST" action="/login" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" value="krishna@smartstock.in" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" value="Admin@123" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <div class="demo-box">
      <p>Quick Demo User: <strong>Krishna</strong></p>
      <a href="/dashboard" class="btn btn-secondary btn-block">Quick Enter as Krishna</a>
    </div>
  </div>
</body>
</html>
